server:
  port: ${SERVER_PORT:8080}
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: codemem

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/codemem?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:codemem}
    password: ${MYSQL_PASSWORD:codemem}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.3
          # 输出上限：控制成本，也避免思考模式的推理内容把预算吃光
          max-tokens: ${OPENAI_MAX_TOKENS:800}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1024}

  mvc:
    async:
      request-timeout: 120s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

codemem:
  ai:
    mock: ${CODEMEM_AI_MOCK:true}
  # 抽取器：rule（默认，稳定）或 llm（结构化输出，失败自动回落规则版）
  extractor: ${CODEMEM_EXTRACTOR:rule}
  # 评测消融开关：默认全开，仅用于 tools/eval 的对比实验
  features:
    memory: ${CODEMEM_FEATURE_MEMORY:true}
    rag: ${CODEMEM_FEATURE_RAG:true}
    state: ${CODEMEM_FEATURE_STATE:true}
    dual: ${CODEMEM_FEATURE_DUAL:true}
  embedding:
    provider: ${EMBEDDING_PROVIDER:openai}
    api-key: ${CODEMEM_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
    base-url: ${EMBEDDING_BASE_URL:https://api.openai.com}
    model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
  memory:
    window-size: ${CODEMEM_MEMORY_WINDOW:12}
    ttl: ${CODEMEM_MEMORY_TTL:7d}
  postgres:
    url: ${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/codemem}
    username: ${POSTGRES_USER:codemem}
    password: ${POSTGRES_PASSWORD:codemem}
  knowledge:
    root: ${KNOWLEDGE_ROOT:E:/Note/知识库}
    chunk-max-chars: ${KNOWLEDGE_CHUNK_MAX_CHARS:1200}
    retrieval-top-k: ${KNOWLEDGE_TOP_K:4}
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:1024}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    max-retries: ${OUTBOX_MAX_RETRIES:3}
    retry-backoff-seconds: ${OUTBOX_RETRY_BACKOFF_SECONDS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.codemem: INFO
    org.springframework.ai: INFO